services:
  chat:
    build:
      context: .
      dockerfile: Dockerfile
    image: 410-chat:local
    restart: unless-stopped
    init: true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      METRICS_FILE: ${METRICS_FILE:-/data/metrics.json}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      HARD_TTL_MS: ${HARD_TTL_MS:-1800000}
      DISCONNECT_GRACE_MS: ${DISCONNECT_GRACE_MS:-15000}
      HEARTBEAT_EVERY_MS: ${HEARTBEAT_EVERY_MS:-5000}
      HEARTBEAT_STALE_MS: ${HEARTBEAT_STALE_MS:-12000}
      MAX_CREATES_PER_WINDOW: ${MAX_CREATES_PER_WINDOW:-10}
      MAX_CONNECTIONS_PER_WINDOW: ${MAX_CONNECTIONS_PER_WINDOW:-60}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GROUP_ROOMS_ENABLED: ${GROUP_ROOMS_ENABLED:-false}
      GROUP_HARD_TTL_MS: ${GROUP_HARD_TTL_MS:-86400000}
      GROUP_REKEY_TIMEOUT_MS: ${GROUP_REKEY_TIMEOUT_MS:-15000}
      MAX_GROUP_ROOMS: ${MAX_GROUP_ROOMS:-1000}
      MAX_GROUP_EMPTY_ROOMS: ${MAX_GROUP_EMPTY_ROOMS:-250}
      MAX_GROUP_WS_MESSAGE_BYTES: ${MAX_GROUP_WS_MESSAGE_BYTES:-32768}
      MAX_GROUP_RELAY_CHARS: ${MAX_GROUP_RELAY_CHARS:-24576}
      MAX_GROUP_RELAYS_PER_WINDOW: ${MAX_GROUP_RELAYS_PER_WINDOW:-120}
      GROUP_RELAY_WINDOW_MS: ${GROUP_RELAY_WINDOW_MS:-10000}
      MAX_GROUP_INBOUND_FRAMES_PER_WINDOW: ${MAX_GROUP_INBOUND_FRAMES_PER_WINDOW:-160}
      MAX_GROUP_INBOUND_BYTES_PER_WINDOW: ${MAX_GROUP_INBOUND_BYTES_PER_WINDOW:-1048576}
      GROUP_INBOUND_WINDOW_MS: ${GROUP_INBOUND_WINDOW_MS:-10000}
      MAX_GROUP_BUFFERED_AMOUNT: ${MAX_GROUP_BUFFERED_AMOUNT:-524288}
    read_only: true
    volumes:
      - metrics_data:/data
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  metrics_data:
